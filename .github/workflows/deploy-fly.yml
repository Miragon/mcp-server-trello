name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      FLY_APP: mcp-server-trello

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Build and push Docker image to Fly.io registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          flyctl auth docker
          docker build \
            -t "registry.fly.io/${FLY_APP}:${SHA}" \
            -t "registry.fly.io/${FLY_APP}:latest" \
            .
          docker push "registry.fly.io/${FLY_APP}:${SHA}"
          docker push "registry.fly.io/${FLY_APP}:latest"

      - name: Deploy image to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          flyctl deploy \
            --app "${FLY_APP}" \
            --image "registry.fly.io/${FLY_APP}:${SHA}" \
            --strategy immediate
