name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      FLY_APP: mcp-server-trello

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Push Docker image to fly.io registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          flyctl auth docker
          docker build \
            -t "registry.fly.io/${FLY_APP}:${SHA}" \
            -t "registry.fly.io/${FLY_APP}:latest" \
            .
          docker push "registry.fly.io/${FLY_APP}:${SHA}"
          docker push "registry.fly.io/${FLY_APP}:latest"
